name: Monitor volo BUE-SCL

on:
  schedule:
    - cron: "17 6 * * 1-4"   # lun-gio, 06:17 UTC = 08:17 ora legale italiana, 07:17 dopo il 25/10
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - id: monitor
        run: python monitor_bue_scl.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SOGLIA_SCL: ${{ vars.SOGLIA_SCL || '1800' }}
      - name: Salva storico
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add storico_bue_scl.csv storico_migliore_giorno.csv
          git commit -m "Prezzi BUE/SCL $(date +%F)" || echo "nessuna modifica"
          git pull --rebase && git push
      - name: Apri issue con il migliore del giorno
        if: hashFiles('ALERT_SCL.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TITOLO: ${{ steps.monitor.outputs.titolo }}
        run: gh issue create --title "$TITOLO" --body-file ALERT_SCL.md
